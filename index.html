<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>額縁ラベル | A4・8面</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f0ea;color:#363c37;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{padding:23px 4vw;border-bottom:1px solid #dbded4;display:flex;justify-content:space-between;align-items:center}.brand{font:700 25px serif}.badge{font-size:12px;color:#788173}main{max-width:1350px;margin:0 auto;padding:30px 4vw;display:grid;grid-template-columns:330px 1fr;gap:42px}h1{font:600 30px/1.5 serif;margin:5px 0 12px}.intro,.note{font-size:12px;line-height:1.9;color:#74806f}.intro{margin-bottom:25px}.label{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:13px}.label span{color:#84907d;font-size:11px}textarea{width:100%;height:250px;border:1px solid #cfd6c7;border-radius:10px;background:#fffefa;padding:16px;font:17px/1.8 serif;resize:vertical;color:#29332c}textarea:focus{outline:2px solid #83957d;outline-offset:2px}button{font:14px system-ui;border:0;cursor:pointer;border-radius:8px;padding:13px 15px}.navigation{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:12px}.back{background:#f8e8ed;color:#704653}.next,.print{background:#f3d5df;color:#704653}button:disabled{opacity:.4;cursor:default}.print{width:100%;margin-top:22px;background:#f3d5df}.counter{font-size:11px;color:#84907d;margin:7px 0 16px}.slots{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:20px}.slot{padding:8px 0;font-size:12px;background:#fffefa;border:1px solid #d5dccd;color:#42523d}.slot[aria-pressed=true]{background:#f3d5df;color:#704653;border-color:#e7b8c9}.slot.filled:after{content:'•';display:block;font-size:9px;line-height:8px}.toolbar{display:flex;justify-content:space-between;margin:5px 0 15px;font-size:12px}.toolbar span{color:#84907d}.desk{padding:25px;background:#e4e6dc;border-radius:14px;overflow:auto}.paper-wrap{margin:auto;position:relative}.paper{width:210mm;height:297mm;padding:10mm;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);background:white;transform-origin:top left;box-shadow:0 5px 20px #26372b15}.card{position:relative;border-right:1px dashed #d9ddd6;border-bottom:1px dashed #d9ddd6;overflow:hidden}.card:nth-child(even){border-right:0}.card:nth-last-child(-n+2){border-bottom:0}.card.active{background:#eef2e9}.frame{position:absolute;inset:3mm;width:calc(100% - 6mm);height:calc(100% - 6mm);color:#171717}.words{position:absolute;left:16%;right:16%;top:20%;bottom:20%;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}.words span{display:block;width:100%;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif CJK JP',serif;line-height:1.35;color:#161616;font-weight:500}.card-button{position:absolute;inset:0;border:0;border-radius:0;background:transparent;padding:0}.card-button:focus-visible{outline:2px solid #587650;outline-offset:-3px}.legend{font-size:11px;color:#84907d;margin-top:13px;text-align:center}.status{font-size:11px;line-height:1.8;color:#74806f}footer{font-size:11px;text-align:center;color:#899181;padding:5px 20px 20px}@media(max-width:850px){main{grid-template-columns:1fr;gap:25px}.desk{padding:15px}textarea{height:180px}.badge{font-size:10px}h1{font-size:26px}}@media print{@page{size:A4 portrait;margin:0}html,body{margin:0!important;padding:0!important;width:210mm;height:297mm;background:white}header,.editor,.toolbar,.legend,footer{display:none!important}main{display:block;margin:0;padding:0;max-width:none}.desk{margin:0;padding:0;border-radius:0;background:white;overflow:visible}.paper-wrap{width:210mm!important;height:297mm!important;margin:0}.paper{transform:none!important;box-shadow:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}.card.active{background:white}.card-button{display:none}.card{border-color:#ddd}}
</style></head><body><header><div class="brand">ラベリングシール</div></header><main><section class="editor"><div class="label"><label for="input" id="input-label">1番の額縁に入れる文字</label><span id="position">1 / 8</span></div><textarea id="input" placeholder="文字を入力" spellcheck="false"></textarea><div class="counter" id="count">0 文字</div><div class="navigation"><button class="back" id="prev">前の枠へ</button><button class="next" id="next">次の枠へ →</button></div><div class="slots" id="slots" aria-label="入力する額縁を選択"></div><button class="print" id="print">印刷 / PDF保存</button><p class="status" id="status" role="status" hidden></p></section><section class="preview"><div class="desk"><div class="paper-wrap"><div class="paper" id="paper"></div></div></div></section></main>
<script>
const input=document.querySelector('#input'),paper=document.querySelector('#paper'),slots=document.querySelector('#slots');let current=0,values=Array(8).fill('');
// Fixed double-line frame with inward-curved corners, matching the reference.
function frame(i){return `<svg class="frame" viewBox="0 0 300 220" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linejoin="miter"><rect x="22" y="25" width="256" height="170" stroke-width="1.35"/><path d="M38 19 H262 Q262 40 285 40 V180 Q262 180 262 201 H38 Q38 180 15 180 V40 Q38 40 38 19 Z" stroke-width="2.2"/></g></svg>`}
for(let i=0;i<8;i++){let card=document.createElement('div');card.className='card';card.innerHTML=frame(i)+'<div class="words"><span></span></div><button class="card-button" aria-label="'+(i+1)+'番の額縁を編集"></button>';card.querySelector('button').onclick=()=>select(i);paper.append(card);let b=document.createElement('button');b.className='slot';b.textContent=i+1;b.setAttribute('aria-label',(i+1)+'番の額縁を編集');b.onclick=()=>select(i);slots.append(b)}
function fit(card){let box=card.querySelector('.words'),span=box.firstElementChild;let low=.5,high=28,best=.5;for(let j=0;j<14;j++){let mid=(low+high)/2;span.style.fontSize=mid+'pt';if(span.scrollHeight<=box.clientHeight&&span.scrollWidth<=box.clientWidth){best=mid;low=mid}else high=mid}span.style.fontSize=best+'pt';return best}
function save(){try{localStorage.setItem('frame-labels-v1',JSON.stringify({values,current}))}catch{document.querySelector('#status').hidden=false;document.querySelector('#status').textContent='自動保存できません。'}}
function update(){paper.querySelectorAll('.card').forEach((card,i)=>{card.classList.toggle('active',i===current);card.querySelector('.words span').textContent=values[i];fit(card)});[...slots.children].forEach((b,i)=>{b.setAttribute('aria-pressed',i===current);b.classList.toggle('filled',!!values[i])});document.querySelector('#input-label').textContent=(current+1)+'番の額縁に入れる文字';document.querySelector('#position').textContent=(current+1)+' / 8';document.querySelector('#count').textContent=values[current].length.toLocaleString()+' 文字';document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===7;document.querySelector('#next').textContent=current===7?'最後の枠です':'次の枠へ →';save()}
function select(i){current=i;input.value=values[i];update();input.focus()}
function scale(){let wrap=paper.parentElement;let avail=document.querySelector('.desk').clientWidth-parseFloat(getComputedStyle(document.querySelector('.desk')).paddingLeft)*2;let ratio=Math.min(1,avail/paper.offsetWidth);paper.style.transform='scale('+ratio+')';wrap.style.width=paper.offsetWidth*ratio+'px';wrap.style.height=paper.offsetHeight*ratio+'px'}
input.addEventListener('input',()=>{values[current]=input.value;update()});document.querySelector('#prev').onclick=()=>select(current-1);document.querySelector('#next').onclick=()=>select(current+1);document.querySelector('#print').onclick=()=>{update();window.print()};window.addEventListener('beforeprint',update);new ResizeObserver(scale).observe(document.querySelector('.desk'));try{let saved=JSON.parse(localStorage.getItem('frame-labels-v1'));if(saved&&Array.isArray(saved.values)&&saved.values.length===8){values=saved.values.map(v=>typeof v==='string'?v:'');current=Number.isInteger(saved.current)&&saved.current>=0&&saved.current<8?saved.current:0}}catch{}input.value=values[current];update();scale();document.fonts.ready.then(update);
</script></body></html>
